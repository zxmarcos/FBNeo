name: "sdl2-imgui"

# Builds of the SDL2 frontend with the Dear ImGui interface: Windows x86_64
# (meson + MSVC), Linux x86_64 and Linux arm64 (meson + GCC, Raspberry Pi 4
# and later with a 64-bit OS). Each sdl2-imgui-* tag publishes them as a
# pre-release.

on:
  push:
    tags: [ 'sdl2-imgui-*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL2_VERSION: "2.32.10"
  SDL2_IMAGE_VERSION: "2.8.12"

jobs:
  build_windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      ARCHIVE: fbneo-sdl2-imgui-windows-x86_64.zip
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install meson, ninja and pkgconf
        run: python -m pip install meson ninja pkgconf

      - name: Get SDL2 and SDL2_image
        run: |
          $deps = "$env:RUNNER_TEMP\deps"
          New-Item -ItemType Directory $deps | Out-Null
          $sdl = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip"
          $img = "https://github.com/libsdl-org/SDL_image/releases/download/release-$env:SDL2_IMAGE_VERSION/SDL2_image-devel-$env:SDL2_IMAGE_VERSION-VC.zip"
          Invoke-WebRequest $sdl -OutFile "$deps\sdl2.zip"
          Invoke-WebRequest $img -OutFile "$deps\sdl2_image.zip"
          Expand-Archive "$deps\sdl2.zip" $deps
          Expand-Archive "$deps\sdl2_image.zip" $deps
          $root = ($deps -replace '\\', '/')
          New-Item -ItemType Directory "$deps\pkgconfig" | Out-Null
          @(
            "root=$root/SDL2-$env:SDL2_VERSION", 'includedir=${root}/include', 'libdir=${root}/lib/x64', '',
            'Name: sdl2', 'Description: Simple DirectMedia Layer', "Version: $env:SDL2_VERSION",
            'Libs: -L${libdir} -lSDL2main -lSDL2 -lshell32', 'Cflags: -I${includedir}'
          ) | Set-Content -Encoding ascii "$deps\pkgconfig\sdl2.pc"
          @(
            "root=$root/SDL2_image-$env:SDL2_IMAGE_VERSION", 'includedir=${root}/include', 'libdir=${root}/lib/x64', '',
            'Name: SDL2_image', 'Description: image loading library for SDL2', "Version: $env:SDL2_IMAGE_VERSION",
            'Requires: sdl2', 'Libs: -L${libdir} -lSDL2_image', 'Cflags: -I${includedir}'
          ) | Set-Content -Encoding ascii "$deps\pkgconfig\SDL2_image.pc"
          "DEPS=$deps" >> $env:GITHUB_ENV

      - name: Build
        run: |
          $env:PKG_CONFIG = (Get-Command pkgconf).Source
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson setup build -Dfrontend=sdl2 -Dsdl_gui=imgui --buildtype=release "--pkg-config-path=$env:DEPS\pkgconfig"
          if ($LASTEXITCODE) { Write-Output "::error::meson setup failed"; exit $LASTEXITCODE }
          meson compile -C build
          if ($LASTEXITCODE) { Write-Output "::error::meson compile failed"; exit $LASTEXITCODE }

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $pkg = "$env:RUNNER_TEMP\pkg"
            New-Item -ItemType Directory $pkg | Out-Null
            Copy-Item build\fbneo.exe $pkg
            Copy-Item "$env:DEPS\SDL2-$env:SDL2_VERSION\lib\x64\SDL2.dll" $pkg
            Copy-Item "$env:DEPS\SDL2_image-$env:SDL2_IMAGE_VERSION\lib\x64\SDL2_image.dll" $pkg
            # the Visual C++ runtime next to the executable, for the machines without the redistributable
            $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
            if (-not $crt) { throw "no Microsoft.VC*.CRT in '$env:VCToolsRedistDir\x64'" }
            Copy-Item "$($crt.FullName)\msvcp140.dll", "$($crt.FullName)\vcruntime140.dll", "$($crt.FullName)\vcruntime140_1.dll" $pkg
            Copy-Item src\license.txt, README-SDL.md $pkg
            Compress-Archive "$pkg\*" $env:ARCHIVE
            Write-Output "::notice::$((Get-ChildItem $pkg | ForEach-Object { "$($_.Name) $($_.Length)" }) -join ', ')"
          } catch {
            Write-Output "::error::Package: $($_.Exception.Message)"
            exit 1
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.ARCHIVE }}

  build_linux:
    name: Build (Linux ${{ matrix.arch }})
    # Ubuntu 22.04 (glibc 2.35): the binaries also run on Debian 12 and
    # Raspberry Pi OS bookworm (glibc 2.36)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: fbneo-sdl2-imgui-linux-${{ matrix.arch }}.tar.gz
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential pkg-config ninja-build python3-pip libsdl2-dev libsdl2-image-dev libgl-dev
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          meson setup build -Dfrontend=sdl2 -Dsdl_gui=imgui --buildtype=release || { echo "::error::meson setup failed"; exit 1; }
          meson compile -C build 2>&1 | tee build.log
          if [ "${PIPESTATUS[0]}" != 0 ]; then
            grep -m 20 'error:' build.log | while read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p pkg/fbneo
          cp build/fbneo src/license.txt README-SDL.md pkg/fbneo/
          strip pkg/fbneo/fbneo
          tar -C pkg -czf "$ARCHIVE" fbneo
          echo "::notice::$(ls -l pkg/fbneo | tail -n +2 | awk '{print $9, $5}' | paste -sd, -)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build_windows, build_linux ]
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          FinalBurn Neo, SDL2 frontend with the Dear ImGui interface (branch sdl2-imgui, $(git rev-parse --short HEAD)).

          The game selector opens when no game is given on the command line; the ROM paths are set in Misc > ROM Paths. See README-SDL.md for the menus and the keys.

          - **Windows x86_64** (\`windows-x86_64.zip\`): unzip and run \`fbneo.exe\`. The SDL2 and Visual C++ runtime DLLs are included.
          - **Linux x86_64** and **Linux arm64** (\`linux-*.tar.gz\`): Ubuntu 22.04 or later, Debian 12 or later. The arm64 build is for the Raspberry Pi 4 and later with a 64-bit OS (Raspberry Pi OS bookworm or later). Install SDL2 and libGL first: \`sudo apt install libsdl2-2.0-0 libsdl2-image-2.0-0 libgl1\`, then \`tar xzf fbneo-sdl2-imgui-linux-*.tar.gz\` and \`./fbneo/fbneo\`. The configuration is kept in \`~/.local/share/fbneo\`.
          EOF
          gh release create "${{ github.ref_name }}" dist/* --title "SDL2 + ImGui (${{ github.ref_name }})" --notes-file notes.md --prerelease
