name: "sdl2-imgui-windows"

# A Windows x86_64 build of the SDL2 frontend with the Dear ImGui interface
# (meson + MSVC), published as a pre-release for each sdl2-imgui-* tag.

on:
  push:
    tags: [ 'sdl2-imgui-*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL2_VERSION: "2.32.10"
  SDL2_IMAGE_VERSION: "2.8.12"
  ARCHIVE: fbneo-sdl2-imgui-windows-x86_64.zip

jobs:
  build:
    name: Build (Windows x86_64, SDL2 + ImGui)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install meson, ninja and pkgconf
        run: python -m pip install meson ninja pkgconf

      - name: Get SDL2 and SDL2_image
        run: |
          $deps = "$env:RUNNER_TEMP\deps"
          New-Item -ItemType Directory $deps | Out-Null
          $sdl = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip"
          $img = "https://github.com/libsdl-org/SDL_image/releases/download/release-$env:SDL2_IMAGE_VERSION/SDL2_image-devel-$env:SDL2_IMAGE_VERSION-VC.zip"
          Invoke-WebRequest $sdl -OutFile "$deps\sdl2.zip"
          Invoke-WebRequest $img -OutFile "$deps\sdl2_image.zip"
          Expand-Archive "$deps\sdl2.zip" $deps
          Expand-Archive "$deps\sdl2_image.zip" $deps
          $root = ($deps -replace '\\', '/')
          New-Item -ItemType Directory "$deps\pkgconfig" | Out-Null
          @(
            "root=$root/SDL2-$env:SDL2_VERSION", 'includedir=${root}/include', 'libdir=${root}/lib/x64', '',
            'Name: sdl2', 'Description: Simple DirectMedia Layer', "Version: $env:SDL2_VERSION",
            'Libs: -L${libdir} -lSDL2main -lSDL2 -lshell32', 'Cflags: -I${includedir}'
          ) | Set-Content -Encoding ascii "$deps\pkgconfig\sdl2.pc"
          @(
            "root=$root/SDL2_image-$env:SDL2_IMAGE_VERSION", 'includedir=${root}/include', 'libdir=${root}/lib/x64', '',
            'Name: SDL2_image', 'Description: image loading library for SDL2', "Version: $env:SDL2_IMAGE_VERSION",
            'Requires: sdl2', 'Libs: -L${libdir} -lSDL2_image', 'Cflags: -I${includedir}'
          ) | Set-Content -Encoding ascii "$deps\pkgconfig\SDL2_image.pc"
          "DEPS=$deps" >> $env:GITHUB_ENV

      - name: Build
        run: |
          $env:PKG_CONFIG = (Get-Command pkgconf).Source
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson setup build -Dfrontend=sdl2 -Dsdl_gui=imgui --buildtype=release "--pkg-config-path=$env:DEPS\pkgconfig"
          if ($LASTEXITCODE) { Write-Output "::error::meson setup failed"; exit $LASTEXITCODE }
          meson compile -C build
          if ($LASTEXITCODE) { Write-Output "::error::meson compile failed"; exit $LASTEXITCODE }

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $pkg = "$env:RUNNER_TEMP\pkg"
            New-Item -ItemType Directory $pkg | Out-Null
            Copy-Item build\fbneo.exe $pkg
            Copy-Item "$env:DEPS\SDL2-$env:SDL2_VERSION\lib\x64\SDL2.dll" $pkg
            Copy-Item "$env:DEPS\SDL2_image-$env:SDL2_IMAGE_VERSION\lib\x64\SDL2_image.dll" $pkg
            # the Visual C++ runtime next to the executable, for the machines without the redistributable
            $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
            if (-not $crt) { throw "no Microsoft.VC*.CRT in '$env:VCToolsRedistDir\x64'" }
            Copy-Item "$($crt.FullName)\msvcp140.dll", "$($crt.FullName)\vcruntime140.dll", "$($crt.FullName)\vcruntime140_1.dll" $pkg
            Copy-Item src\license.txt, README-SDL.md $pkg
            Compress-Archive "$pkg\*" $env:ARCHIVE
            Write-Output "::notice::$((Get-ChildItem $pkg | ForEach-Object { "$($_.Name) $($_.Length)" }) -join ', ')"
          } catch {
            Write-Output "::error::Package: $($_.Exception.Message)"
            exit 1
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-sdl2-imgui-windows-x86_64
          path: ${{ env.ARCHIVE }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          FinalBurn Neo, SDL2 frontend with the Dear ImGui interface (branch sdl2-imgui, $(git rev-parse --short HEAD)).

          Windows x86_64, built with MSVC. Unzip and run fbneo.exe; the ROM paths are set in Misc > ROM Paths. See README-SDL.md for the menus and the keys.
          "@
          gh release create $tag $env:ARCHIVE --title "SDL2 + ImGui ($tag)" --notes $notes --prerelease
